# Signa — Cloudflare Worker configuration (API + web app on one Worker).
#
# The TOP-LEVEL configuration is PRODUCTION, so a plain `wrangler deploy` (as run by
# Cloudflare Workers Builds) deploys production. Local development uses `--env dev`
# (`npm run dev`), staging uses `--env staging`.
#
# Secrets are NOT stored here. Set them in the dashboard (Worker → Settings → Variables
# and Secrets) or with `wrangler secret put <NAME> [--env <env>]`:
#   APP_SECRET (required, ≥ 32 random chars), DEV_PAYMENT_WEBHOOK_SECRET (dev payments only),
#   SIGN_PROVIDER_API_KEY (http sign provider), GOOGLE_CLIENT_SECRET (optional OAuth).
# For local development copy .dev.vars.example to .dev.vars.

name = "signa-api" # must match the Worker in the Cloudflare dashboard
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Temporary public address: https://signa-api.abd-digital.workers.dev (until a custom domain is set).
workers_dev = true

[observability]
enabled = true

# Builds the web app (Next.js static export in ./web). On Cloudflare Workers Builds it also
# applies pending D1 migrations to the production database before the Worker is uploaded.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "./web/out"
not_found_handling = "404-page"
# Only API/health routes run the Worker; everything else is served from static assets.
run_worker_first = ["/api/*", "/health*", "/ready*"]

[vars]
APP_ENV = "production"
# Site and API are served from the same Worker (same origin).
APP_BASE_URL = "https://signa-api.abd-digital.workers.dev"
API_BASE_URL = "https://signa-api.abd-digital.workers.dev"
CORS_ALLOWED_ORIGINS = "https://signa-api.abd-digital.workers.dev"
LOG_LEVEL = "info"
# Delivery stays disabled until a real provider adapter is implemented and configured.
EMAIL_PROVIDER = "disabled"
# No payment provider selected yet: checkout returns `provider_not_configured`.
PAYMENT_PROVIDER = "none"
SIGN_PROVIDER = "dictionary_lookup"
SIGN_PROVIDER_VALIDATED = "false"
SIGN_SYNC_FALLBACK_MAX_CHARS = "280"
SIGN_RESULT_TTL_SECONDS = "3600"

# Production resources that exist in the Cloudflare account (attached to the signa-api Worker).
[[d1_databases]]
binding = "DB"
database_name = "signa-db"
database_id = "a19458fd-f2ab-48c0-ad9c-fd4c185eaf39"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "signa-assets"

[[queues.producers]]
binding = "SIGN_JOBS_QUEUE"
queue = "signa-sign-jobs"

# Bounded retries; jobs that still fail are expired by the cron sweeper (10-minute deadline).
# To add a dead-letter queue: `wrangler queues create signa-sign-jobs-dlq`, then set
# dead_letter_queue below and add a consumer for it.
[[queues.consumers]]
queue = "signa-sign-jobs"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3

[triggers]
crons = ["*/10 * * * *"]

# ---------------------------------------------------------------------------
# Local development: `npm run dev` (wrangler dev --env dev). Resources are simulated locally.
[env.dev]
name = "signa-api-dev"
workers_dev = true

[env.dev.vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:8787"
API_BASE_URL = "http://localhost:8787"
CORS_ALLOWED_ORIGINS = "http://localhost:3000"
LOG_LEVEL = "info"
EMAIL_PROVIDER = "dev"
PAYMENT_PROVIDER = "dev"
SIGN_PROVIDER = "dictionary_lookup"
SIGN_PROVIDER_VALIDATED = "false"
SIGN_SYNC_FALLBACK_MAX_CHARS = "280"
SIGN_RESULT_TTL_SECONDS = "3600"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "signa-db"
database_id = "00000000-0000-0000-0000-000000000000" # local only
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "signa-assets"

[[env.dev.queues.producers]]
binding = "SIGN_JOBS_QUEUE"
queue = "signa-sign-jobs"

[[env.dev.queues.consumers]]
queue = "signa-sign-jobs"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "signa-sign-jobs-dlq"

[[env.dev.queues.consumers]]
queue = "signa-sign-jobs-dlq"
max_retries = 1

# ---------------------------------------------------------------------------
[env.staging]
name = "signa-api-staging"
workers_dev = false

[env.staging.vars]
APP_ENV = "staging"
APP_BASE_URL = "https://staging.signa.example"
API_BASE_URL = "https://staging.signa.example"
CORS_ALLOWED_ORIGINS = "https://staging.signa.example"
LOG_LEVEL = "info"
EMAIL_PROVIDER = "dev"
PAYMENT_PROVIDER = "dev"
SIGN_PROVIDER = "dictionary_lookup"
SIGN_PROVIDER_VALIDATED = "false"
SIGN_SYNC_FALLBACK_MAX_CHARS = "280"
SIGN_RESULT_TTL_SECONDS = "3600"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "signa-db-staging"
database_id = "00000000-0000-0000-0000-000000000000" # create with `wrangler d1 create signa-db-staging`
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "signa-assets-staging"

[[env.staging.queues.producers]]
binding = "SIGN_JOBS_QUEUE"
queue = "signa-sign-jobs-staging"

[[env.staging.queues.consumers]]
queue = "signa-sign-jobs-staging"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "signa-sign-jobs-staging-dlq"

[[env.staging.queues.consumers]]
queue = "signa-sign-jobs-staging-dlq"
max_retries = 1

[env.staging.triggers]
crons = ["*/10 * * * *"]
